name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The go.mod minimum and the current release; go install users get the latter.
        go: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go mod tidy and verify
        run: |
          go mod tidy -diff
          go mod verify
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a new linter release must not break CI without a change here.
          version: v2.15.0
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
